# Crash&Learn Grand Prix — Compose services
#
# CPU default (all headless):
#   sim          — smoke test / one-off scripts
#   train        — SB3 training loop (CPU)
#   tensorboard  — TensorBoard on :6006
#   viz          — headless PNG via matplotlib Agg
#
# GPU opt-in (requires nvidia-docker + DISPLAY):
#   viz-gpu      — f1tenth native pyglet/GL renderer
#
# --- sim_recorder + viz_replay ---
# Record an episode (headless, max speed):
#   docker compose run --rm recorder
#   docker compose run --rm recorder python sim_recorder.py --steps 1000 --num-cars 2
#
# Replay on host display:
#   xhost +local:docker
#   docker compose run --rm replay
#   docker compose run --rm replay python viz_replay.py --npz /app/episode.npz --follow
#
# Quick start:
#   docker compose run --rm train           # run train_ppo.py
#   docker compose run --rm viz             # headless PNG → recordings/
#   docker compose up  tensorboard          # open http://localhost:6006
#   docker compose up  viz-gpu              # pyglet window (GPU + X needed)
#
# Shared bind-mount: ./ → /app (live-reloads code changes without rebuild).
# recordings/ directory is created on first use.

services:

  sim:
    build:
      context: .
      target: base
    volumes:
      - .:/app
    working_dir: /app
    environment:
      MPLBACKEND: Agg
    command: python demo.py

  train:
    build:
      context: .
      target: base
    volumes:
      - .:/app
    working_dir: /app
    environment:
      MPLBACKEND: Agg
    command: python train_ppo.py

  tensorboard:
    build:
      context: .
      target: base
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "6006:6006"
    command: tensorboard --logdir /app/logs --host 0.0.0.0 --port 6006

  viz:
    build:
      context: .
      target: base
    volumes:
      - .:/app
    working_dir: /app
    environment:
      MPLBACKEND: Agg
    command: python viz_topdown.py

  viz-gpu:
    build:
      context: .
      target: gpu
    runtime: nvidia
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    working_dir: /app
    environment:
      DISPLAY: "${DISPLAY:-:0}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics
    command: python viz_pyglet.py

  # --- sim_recorder (headless episode recording) ---
  recorder:
    build:
      context: .
      target: base
    volumes:
      - .:/app
    working_dir: /app
    environment:
      MPLBACKEND: Agg
    command: python sim_recorder.py --steps 500 --num-cars 1 --out /app/episode.npz

  # --- viz_replay (X11-forwarded top-down replay) ---
  replay:
    build:
      context: .
      target: gpu
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    working_dir: /app
    environment:
      DISPLAY: "${DISPLAY:-:0}"
    command: python viz_replay.py --npz /app/episode.npz
